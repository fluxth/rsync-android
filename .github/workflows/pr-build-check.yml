name: PR build check

on:
  pull_request:
    paths:
      - Dockerfile
      - scripts/**
      - .github/workflows/build-rsync-android.yml
      - .github/workflows/pr-build-check.yml

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: docker build -t rsync-builder .
