name: Build rsync for Android

on:
  schedule:
    - cron: "43 15 * * *" # daily at 00:43 JST
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      rsync_version: ${{ steps.version.outputs.rsync_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve rsync version
        id: version
        run: |
          VERSION=$(grep -oP '(?<=^ARG RSYNC_VERSION=).*' Dockerfile)
          echo "rsync_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if release is already up to date
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BUILT_SHA=$(gh release view --json body -q .body 2>/dev/null | grep -oP '(?<=Built from commit: )[0-9a-f]{40}' || true)

          if [ "$BUILT_SHA" = "${{ github.sha }}" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: rsync-builder:latest
          build-args: RSYNC_VERSION=${{ needs.check.outputs.rsync_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract binary
        run: |
          docker create --name extract rsync-builder
          docker cp extract:/build/compiled ./compiled
          docker rm extract

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rsync-android
          path: compiled/

  release:
    needs: [check, build]
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rsync-android
          path: compiled

      - name: Compute release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date -u +%Y%m%d)
          PREFIX="v${{ needs.check.outputs.rsync_version }}-${DATE}"
          COUNT=$(gh api "repos/${{ github.repository }}/git/matching-refs/tags/${PREFIX}" --jq 'length')
          NUM=$(printf "%02d" "$COUNT")
          echo "tag=${PREFIX}${NUM}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          make_latest: true
          body: |
            Built from commit: ${{ github.sha }}
          files: compiled/*
