name: Build rsync for Android

on:
  push:
    branches: [main]
    paths: [Dockerfile]
  workflow_dispatch:
    inputs:
      rsync_version:
        description: rsync version to build (overrides the Dockerfile default)
        required: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      rsync_version: ${{ steps.version.outputs.rsync_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve rsync version
        id: version
        run: |
          if [ -n "${{ inputs.rsync_version }}" ]; then
            VERSION="${{ inputs.rsync_version }}"
          else
            VERSION=$(grep -oP '(?<=^ARG RSYNC_VERSION=).*' Dockerfile)
          fi
          echo "rsync_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: docker build --build-arg RSYNC_VERSION="${{ steps.version.outputs.rsync_version }}" -t rsync-builder .

      - name: Extract binary
        run: |
          docker create --name extract rsync-builder
          docker cp extract:/build/compiled ./compiled
          docker rm extract

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rsync-android
          path: compiled/

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rsync-android
          path: compiled

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ needs.build.outputs.rsync_version }}
          files: compiled/*
